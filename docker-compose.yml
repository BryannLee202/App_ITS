version: '3.8'

services:
  its-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: its_telematics_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=its_smart_vehicle_rental_production_secret_2026
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - its_network

networks:
  its_network:
    driver: bridge

  <body>
    <noscript>Vui lòng kích hoạt JavaScript để chạy EcoGo Smart Mobility.</noscript>
    <div id="root"></div>

    <div id="ecogo-error-boundary">
      <div style="font-size: 40px; margin-bottom: 12px;">🌱</div>
      <h3 style="color: #4E3322; margin: 0 0 8px 0; font-size: 18px;">EcoGo Smart Mobility</h3>
      <p style="color: #6F4E37; font-size: 14px; max-width: 320px; margin-bottom: 20px;">Đang tải phiên bản mới nhất từ máy chủ...</p>
      <button onclick="window.location.reload(true)" style="background: #4E3322; color: #fff; border: none; padding: 10px 24px; border-radius: 99px; font-weight: bold; cursor: pointer; font-size: 14px;">Tải lại ngay</button>
    </div>

    <script>
      // Anti-white screen fallback
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          var fb = document.getElementById('ecogo-error-boundary');
          if (fb) fb.style.display = 'flex';
        }
      });
    </script>
    <script src="/bundle.js?v=1.0.9" defer></script>

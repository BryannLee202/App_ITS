name: ITS Smart Vehicle Rental - Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: BACKEND TESTING & TELEMATICS LINT
  # ==========================================
  backend-test:
    name: Backend CI & ITS Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Verify ITS Mathematical Engine (GLOSA & Shockwave)
        run: |
          cd backend
          node -e "
            const ITSEngine = require('./src/services/itsEngine');
            const glosa = ITSEngine.computeGreenWaveSpeedAdvisory(300, 40);
            if (!glosa.recommendedSpeedKmh) process.exit(1);
            console.log('GLOSA Test Passed: Advisory Speed =', glosa.recommendedSpeedKmh);

            const shockwave = ITSEngine.evaluateTrafficShockwave(1200, 25, 600, 90);
            if (typeof shockwave.shockwaveSpeedKmh !== 'number') process.exit(1);
            console.log('Shockwave Test Passed: v_w =', shockwave.shockwaveSpeedKmh);

            const eco = ITSEngine.calculateEcoImpact(15, 'ELECTRIC');
            if (eco.co2SavedKg <= 0) process.exit(1);
            console.log('Eco Impact Test Passed: CO2 Saved =', eco.co2SavedKg, 'kg');
          "

      - name: Verify Backend Server Startup
        run: |
          cd backend
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:5000/api/health || exit 1
          kill $SERVER_PID

  # ==========================================
  # JOB 2: MOBILE EXPO APP BUILD VERIFICATION
  # ==========================================
  mobile-ci:
    name: Mobile App Client CI (Expo React Native)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Expo Config & Dependency Integrity Check
        run: |
          cd mobile
          npx expo config --type public

  # ==========================================
  # JOB 3: DOCKER CONTAINER IMAGE BUILD CHECK
  # ==========================================
  docker-build:
    name: Containerization & Docker Image Validation
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: its-rental-backend:latest
